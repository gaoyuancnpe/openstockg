# market 暗门直连 vhost —— 裸 IP + 端口 + 令牌换 Cookie(无域名/无证书/无 SSO Cookie)
#
# 模式:自己人首次访问 http://<服务器IP>:<MARKET_PORT>/<MARKET_TOKEN>
#      nginx 校验令牌 → 302 到 / 并种下 HttpOnly Cookie → 后续请求凭 Cookie 放行,
#      页面静态资源无需携带令牌前缀。
# 安全:令牌外一律 404(端口扫描只见 404);HTTP 为明文(自用权衡,见 README 风险说明);
#      令牌只存在于服务器 conf 与私有仓库的门户暗门常量,公开仓库仅占位符。
# 渲染:部署时 sed 替换 <MARKET_TOKEN> 与 <MARKET_PORT>(见 deploy/README-market.md)。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen <MARKET_PORT>;
    listen [::]:<MARKET_PORT>;
    server_name _;

    # 令牌入口(带或不带尾斜杠都认):校验通过即种 HttpOnly Cookie 并跳回根路径
    location = /<MARKET_TOKEN> {
        add_header Set-Cookie "mk=<MARKET_TOKEN>; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000";
        return 302 /;
    }
    location = /<MARKET_TOKEN>/ {
        add_header Set-Cookie "mk=<MARKET_TOKEN>; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000";
        return 302 /;
    }

    location / {
        # 凭 Cookie 放行;未持令牌 Cookie 的一切访问一律 404
        if ($http_cookie !~ "mk=<MARKET_TOKEN>") {
            return 404;
        }

        include /etc/nginx/snippets/yuren-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 筛选/0AMV 等长操作与实时流
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;

        proxy_pass http://127.0.0.1:3080;
    }
}
