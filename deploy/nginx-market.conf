# market 子站 vhost —— market.<主域名>(Yuren Harness 行情智能体实例)
# 端口 80:ACME 验证放行,其余 301 到 https
# 端口 443:auth_request 本地验签(yuren_sso 父域 Cookie + 认证中心公钥)后
#           反代 127.0.0.1:3080(dsh web);未登录 302 到认证中心统一登录页。
# 渲染:deploy/scripts/render-nginx.sh(主仓)将 PLACEHOLDER_DOMAIN 替换为真实主域名;
#       证书未签发时 #YR_SSL_BEGIN..#YR_SSL_END 整段剔除(首次初始化只跑 80 + ACME)。
# 前置:snippets/yuren-acme.conf / yuren-ssl.conf / yuren-proxy.conf(主仓 deploy/nginx/snippets)。

# WebSocket/SSE 升级映射(dsh web 实时通道;非升级请求回落 close)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name market.PLACEHOLDER_DOMAIN;

    include /etc/nginx/snippets/yuren-acme.conf;

    location / {
        return 301 https://market.PLACEHOLDER_DOMAIN$request_uri;
    }
}
#YR_SSL_BEGIN
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name market.PLACEHOLDER_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/market.PLACEHOLDER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.PLACEHOLDER_DOMAIN/privkey.pem;
    include /etc/nginx/snippets/yuren-ssl.conf;

    client_max_body_size 20m;

    # 本地验签服务(yuren-market-verify.service,仅 127.0.0.1:8108)
    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:8108/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    error_page 401 = @sso_login;

    location @sso_login {
        return 302 https://auth.PLACEHOLDER_DOMAIN/login?next=$scheme://$host$request_uri;
    }

    location / {
        auth_request /_auth;

        include /etc/nginx/snippets/yuren-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 筛选/0AMV 等长操作与实时流,放宽超时并关闭缓冲
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;

        proxy_pass http://127.0.0.1:3080;
    }
}
#YR_SSL_END
